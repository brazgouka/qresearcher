[project]
name = "market-research"
version = "0.1.0"
description = "Quantitative research platform for falsifying trading-strategy hypotheses"
readme = "README.md"
license = "MIT"
requires-python = "==3.13.*"
dependencies = [
    "polars>=1.9",
    "numpy>=2.1",
    "scipy>=1.14",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "hydra-core>=1.3",
    "typer>=0.13",
    "loguru>=0.7",
    "yfinance>=0.2",
    "exchange-calendars>=4.5",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_research"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
